name: Debug Download Playing God

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Setup yt-dlp and ffmpeg
        run: |
          python3 -m pip install --upgrade yt-dlp
          sudo apt-get update && sudo apt-get install -y ffmpeg
          echo "yt-dlp version: $(yt-dlp --version)"

      - name: Try download with verbose logging
        run: |
          mkdir -p music
          QUERY="Motionless In White - Playing God ft. Corey Taylor"
          echo "Searching for: $QUERY"
          # فقط یوتیوب را تست می‌کنیم چون شناخته‌شده‌تر است
          yt-dlp \
            --verbose \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 0 \
            --embed-thumbnail \
            --output "music/%(title)s.%(ext)s" \
            "ytsearch1:${QUERY}" || echo "FAILED"

          echo "=== Files in music/ ==="
          ls -la music/ || echo "No files"

      - name: Upload artifact if file exists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: music/*.mp3
          retention-days: 3
