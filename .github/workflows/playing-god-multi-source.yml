name: Download Playing God (Multi-Source - Artifact)

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Setup yt-dlp and ffmpeg
        run: |
          python3 -m pip install --upgrade yt-dlp
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download "Playing God" with fallback sources and cover art
        run: |
          mkdir -p music
          QUERY="Motionless In White - Playing God ft. Corey Taylor"
          echo "Searching for: $QUERY"
          for prefix in "scsearch" "bcsearch" "freemusicarchive" "ytsearch"; do
            echo "  -> Trying source: $prefix"
            if yt-dlp \
              --extract-audio \
              --audio-format mp3 \
              --audio-quality 0 \
              --embed-thumbnail \
              --output "music/%(title)s.%(ext)s" \
              "${prefix}:${QUERY}" ; then
              echo "  -> SUCCESS with $prefix"
              break
            else
              echo "  -> FAILED with $prefix, moving to next..."
            fi
          done

      - name: Upload MP3 as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playing_God
          path: music/*.mp3
          retention-days: 7   # یک هفته نگهداری (می‌توانی افزایش دهی)
