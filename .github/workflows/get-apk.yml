name: Fetch Termux API from F-Droid

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Termux API APK from F-Droid repository
        run: |
          curl -L -o termux-api.apk \
            https://f-droid.org/repo/com.termux.api_53.apk

      - name: Commit and push to repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add termux-api.apk
          git commit -m "Update termux-api APK from F-Droid" || echo "No changes to commit"
          git push
