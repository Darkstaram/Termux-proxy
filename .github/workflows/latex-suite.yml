name: Fetch Obsidian LaTeX Suite

on:
  workflow_dispatch:   # اجرای دستی

permissions:
  contents: write      # برای commit کردن فایل

jobs:
  fetch-latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download plugin zip from GitHub Releases
        run: |
          curl -L -o obsidian-latex-suite.zip \
            "https://github.com/artisticat1/obsidian-latex-suite/releases/download/1.11.5/obsidian-latex-suite.zip"

      - name: Commit and push to repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add obsidian-latex-suite.zip
          git commit -m "Add Obsidian LaTeX Suite v1.11.5" || echo "No changes"
          git push
